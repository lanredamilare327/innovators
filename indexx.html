<h1>App B · Advising <small>(record-first, XPath parser, different internal model)</small></h1>
<p>Internal model differs from App A: <code>fullName</code> ("Last, First"), <code>dob</code> as DD/MM/YYYY, <code>yr</code> (1–6) instead of Level, <code>cgpa</code>. It has <b>no course list</b>, so courses cannot be stored.</p>

<textarea id="xml" placeholder="Paste XML from App A here"></textarea>
<button onclick="importXml()">Import XML</button>
<button class="alt" onclick="exportXml()">Export current record as XML</button>
